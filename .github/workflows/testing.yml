# Runs the PHPUnit tests, as generated by `wp scaffold plugin-tests --ci=github` and adapted:
# PHP 8.4, Composer for PHPUnit, and Open Source Event Calendar from WordPress.org.
name: Testing

on:
  push:
  pull_request:
  # Reused by release.yml before a release is published.
  workflow_call:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4']
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Install dev tools
        run: composer install --no-interaction --no-progress

      - name: Download Open Source Event Calendar
        run: |
          curl -sSL -o /tmp/osec.zip https://downloads.wordpress.org/plugin/open-source-event-calendar.latest-stable.zip
          unzip -q /tmp/osec.zip -d /tmp/osec

      # bin/install-wp-tests.sh fetches the WordPress test library with Subversion,
      # which current Ubuntu runner images no longer include.
      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup tests
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 latest true

      - name: Run tests
        env:
          OSEC_PLUGIN_DIR: /tmp/osec/open-source-event-calendar
        run: vendor/bin/phpunit
