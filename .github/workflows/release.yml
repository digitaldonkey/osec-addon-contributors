# Publishes a GitHub release when a version tag is pushed (0.2.0 or v0.2.0).
#
# 1. Checks that the tag matches the plugin header "Version", the readme "Stable tag" and
#    OSEC_ADDON_CONTRIBUTORS_VERSION, so a release never ships a mismatched version.
# 2. Runs the tests (testing.yml, reused).
# 3. Builds the plugin zip from what .distignore lets through (folder osec-addon-contributors/ inside)
#    and creates the release with it; the notes are generated from the commits since the last tag.
#
# Release a version: set the three version numbers, commit, then
#   git tag 0.2.0 && git push origin 0.2.0
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  version:
    name: Version matches tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Compare versions
        run: bash bin/check-version.sh "${GITHUB_REF_NAME#v}"

  tests:
    name: Tests
    needs: version
    uses: ./.github/workflows/testing.yml

  release:
    name: Build and publish
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Build zip
        run: bash bin/build-zip.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/osec-addon-contributors-${GITHUB_REF_NAME#v}.zip" \
            --verify-tag --generate-notes \
            --title "Contributors Add-on ${GITHUB_REF_NAME#v}"
